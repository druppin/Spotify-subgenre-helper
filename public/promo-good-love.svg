<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background checkered pattern -->
  <defs>
    <pattern id="checkerboard" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="40" fill="#F8B4D4"/>
      <rect x="0" y="0" width="20" height="20" fill="#F5A7CC"/>
      <rect x="20" y="20" width="20" height="20" fill="#F5A7CC"/>
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#checkerboard)"/>

  <!-- Album cover container -->
  <rect x="80" y="40" width="240" height="320" fill="#000" opacity="0.1" rx="8"/>

  <!-- Album cover background -->
  <rect x="75" y="35" width="240" height="320" fill="#FDD7E8" rx="8"/>

  <!-- Pink tones and gradient -->
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8B4D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5A7CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Album art placeholder with pattern -->
  <rect x="75" y="35" width="240" height="240" fill="url(#pinkGrad)" rx="8"/>

  <!-- Priya Ragu text -->
  <rect x="75" y="275" width="240" height="80" fill="#FDD7E8" rx="0,0,8,8"/>
  <text x="195" y="310" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">PRIYA RAGU</text>
  <text x="195" y="335" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Good Love 2.0 - Soulwax Remix</text>

  <!-- Main title -->
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#333">Good Love 2.0</text>
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="32" fill="#555">Soulwax Remix</text>

  <!-- Artist info -->
  <text x="400" y="210" font-family="Arial, sans-serif" font-size="20" fill="#666">Priya Ragu · Soulwax</text>

  <!-- Spotify tag -->
  <rect x="400" y="260" width="280" height="40" fill="#1DB954" rx="20"/>
  <text x="540" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Now Playing on Spotify</text>
</svg>