<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Spotify Subgenre Assistant</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #0a0a0a;
        color: #fff;
        font: 14px/1.5 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      p {
        margin: 0 0 16px;
        color: #a3a3a3;
      }
      a.button {
        display: inline-block;
        padding: 8px 20px;
        border-radius: 999px;
        background: #16a34a;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a.button:hover {
        background: #22c55e;
      }
      .small {
        margin-top: 20px;
        font-size: 12px;
        color: #737373;
      }
      .small a {
        color: #a3a3a3;
      }
    </style>
  </head>
  <body>
    <h1>Subgenre Assistant is running</h1>
    <p>It opens in your web browser at <span id="url"></span>. Closing this window stops it.</p>
    <a class="button" id="open" target="_blank">Open in browser</a>
    <div class="small">
      <a id="data" target="_blank">Show data folder</a> · <a id="log" target="_blank">Show log</a>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const toFileUrl = (p) => "file:///" + p.replace(/\\/g, "/").replace(/^\//, "");
      document.getElementById("url").textContent = params.get("url");
      document.getElementById("open").href = params.get("url");
      document.getElementById("data").href = toFileUrl(params.get("data"));
      document.getElementById("log").href = toFileUrl(params.get("log"));
    </script>
  </body>
</html>
